<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARS Gestión · Demo</title>
<style>
:root{--green:#163b34;--green2:#23836a;--bg:#f4f7f6;--ink:#17211f;--muted:#66736f;--line:#dce5e1;--white:#fff;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;background:var(--green);color:#fff;font-weight:650}button.secondary{background:#e8efec;color:var(--green)}button.outline{background:#fff;color:var(--green);border:1px solid var(--line)}button.small{padding:7px 10px;font-size:13px}.app{max-width:760px;margin:auto;min-height:100vh;background:var(--white);box-shadow:0 0 30px #12231b0a}.top{position:sticky;top:0;z-index:50;background:var(--green);color:white;padding:16px 18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.home-btn{width:44px;height:44px;flex:0 0 44px;padding:0;display:grid;place-items:center;background:#ffffff1c;border:1px solid #ffffff55;border-radius:12px;color:#fff;font-size:23px}.home-btn:active{transform:scale(.96)}.logo{width:45px;height:45px;border-radius:13px;background:#ffffff1c;display:grid;place-items:center;font-size:25px}.brand h1{font-size:19px;margin:0}.brand p{font-size:12px;margin:3px 0 0;color:#d5e4de}.content{padding:18px}.muted{color:var(--muted);font-size:13px}.title{font-size:24px;line-height:1.2;margin:8px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:16px;padding:15px;background:white}.tile{min-height:125px;display:flex;flex-direction:column;gap:9px;text-align:left;color:var(--ink);background:#fff;border:1px solid var(--line);padding:16px}.tile .emoji{font-size:28px}.tile b{font-size:16px}.tile span:last-child{font-size:12px;color:var(--muted);font-weight:400}.tile.selected{border:2px solid var(--green2);background:#f1f8f5}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:13px;font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd7d2;border-radius:10px;padding:12px;background:white;color:var(--ink)}.field textarea{min-height:70px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.actions button{flex:1}.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700;background:#eaf4ef;color:var(--green)}.pill.amber{background:#fff3dd;color:#8c5a11}.pill.gray{background:#eef1f0;color:#52605b}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:13px 0}.item:last-child{border-bottom:0}.price{font-weight:750;white-space:nowrap}.total{background:#f0f6f3;border-radius:14px;padding:15px}.navback{position:relative;z-index:2;display:inline-flex;align-items:center;min-height:44px;border:0;background:#e8efec;color:var(--green);padding:9px 13px;border-radius:10px;font-weight:700;touch-action:manipulation;cursor:pointer}.hidden{display:none!important}.footer{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);text-align:center}.notice{padding:11px 12px;background:#fff7e7;border:1px solid #f1dfb8;border-radius:12px;color:#765017;font-size:12px}.search{margin:10px 0}.smallmuted{font-size:11px;color:var(--muted)}.qty{display:flex;align-items:center;gap:8px}.qty button{padding:4px 10px;border-radius:8px}.service{display:flex;gap:12px;align-items:center}.service .emoji{font-size:25px;background:#f1f5f3;border-radius:10px;padding:9px}.login{padding:26px 20px 34px}.loginbrand{text-align:center;margin:8px 0 26px}.loginbrand .logo{margin:auto;width:64px;height:64px;font-size:32px}.loginbrand h1{margin:12px 0 4px}.sectionhead{display:flex;align-items:center;gap:12px;margin:14px 0}.sectionhead h2{font-size:19px;margin:0}.line{height:1px;background:var(--line);flex:1}
@media(min-width:600px){.content{padding:24px}.top{padding:25px 24px}.login{padding:38px 28px}}

/* Firma táctil: área visible y controlada en móviles */
.sigrow{display:grid;grid-template-columns:1fr;gap:18px;margin-top:12px}
.sigpad{width:100%;height:170px;border:2px dashed #b7c9c2;border-radius:12px;background:#fff;overflow:hidden;touch-action:none;margin:8px 0}
.sigpad canvas{display:block!important;width:100%!important;height:166px!important;max-height:166px!important;background:#fff;border-radius:10px;touch-action:none;cursor:crosshair}
.sigrow label{display:block;font-weight:700;margin-top:10px}
#homeButton{touch-action:manipulation}
@media(min-width:650px){.sigrow{grid-template-columns:1fr 1fr}}

/* ===== ARS Gestión · Dashboard visual moderno (solo presentación) ===== */
:root{
  --green:#0b2445;--green2:#087fd0;--bg:#eef3f9;--ink:#142238;--muted:#64758d;
  --line:#dce5f0;--white:#fff;--amber:#ff7a00;--ars-blue:#0b2d60;--ars-blue2:#075b91;
}
body{background:#edf2f8;color:var(--ink)}
.app{max-width:1100px;background:#f7f9fc;box-shadow:0 18px 60px #061a3520}
.top{
  background:linear-gradient(115deg,#071d43 0%,#0b3978 58%,#08618d 100%);
  border-bottom:6px solid #ff7900;padding:18px 24px;min-height:88px;
}
.brand{gap:15px}
.logo{
  width:62px;height:62px;flex:0 0 62px;border-radius:16px;background:#fff;
  color:#0b3978;display:grid;place-items:center;font-size:28px;font-weight:950;
  box-shadow:0 5px 18px #001b4430;border:2px solid #dcecff;
}
.brand h1{font-size:clamp(20px,2.5vw,27px);font-weight:850;letter-spacing:-.5px}
.brand p{font-size:13px;color:#d8e8ff}
.home-btn{width:48px;height:48px;flex-basis:48px;border-radius:15px;background:#ffffff17;border:1px solid #ffffff55}
.content{padding:24px;min-height:calc(100vh - 160px)}
.title{font-size:clamp(24px,3vw,32px);letter-spacing:-.7px;font-weight:850;color:#142238}
.muted{color:#687a92}
.card{border:1px solid #e2eaf4;border-radius:18px;background:#fff;box-shadow:0 5px 18px #163b5b0a}
.grid{gap:16px}
.tile{
  position:relative;overflow:hidden;min-height:270px;padding:0 20px 20px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:8px;
  border:1px solid #e0e8f2;border-radius:18px;background:#fff;color:#142238;
  box-shadow:0 7px 22px #12365a12;transition:transform .18s ease,box-shadow .18s ease;
}
.tile:hover{transform:translateY(-3px);box-shadow:0 13px 28px #12365a20}
.tile::before{
  content:"";position:absolute;inset:0 0 auto;height:145px;background-size:cover;background-position:center;
  background-image:var(--tile-image); 
}
.tile::after{
  content:"";position:absolute;top:0;left:0;right:0;height:145px;
  background:linear-gradient(0deg,#06172b18,#06172b08);
  border-bottom:4px solid var(--tile-accent,#087fd0);
}
.tile .emoji{
  position:relative;z-index:1;margin-top:105px;width:58px;height:58px;display:grid;place-items:center;
  border-radius:16px;background:var(--tile-accent,#087fd0);color:white;font-size:28px;
  border:3px solid #fff;box-shadow:0 4px 14px #0a244526;
}
.tile b,.tile span:last-child{position:relative;z-index:1}
.tile b{font-size:19px;line-height:1.2;font-weight:850}
.tile span:last-child{font-size:14px;line-height:1.35;color:#6a7b92;font-weight:450}

.sectionhead{margin:24px 0 14px}
.sectionhead h2{font-size:21px;font-weight:850;color:#142238}
.line{background:#d9e3ef}
.pill{background:#e7f5ff;color:#086cb0}
.pill.amber{background:#fff1dc;color:#a85a00}
button{background:linear-gradient(135deg,#087fd0,#075eaa);box-shadow:0 4px 12px #087fd01c}
button.secondary{background:#e8f1fb;color:#0a477e;box-shadow:none}
button.outline,.navback{background:#fff;color:#0a477e;border:1px solid #d6e2ef;box-shadow:none}
.field input,.field select,.field textarea{border-color:#d3deeb;border-radius:12px}
.total{background:#eef6ff;border:1px solid #d9eaff}
.notice{border-radius:14px}
.footer{background:#0a1e37;color:#b8c8dc;border-top:4px solid #ff7900}
.loginbrand .logo{background:#fff;color:#0b3978}
@media(min-width:760px){
  .content{padding:28px}
  .grid{gap:18px}
  .tile{min-height:285px}
  .tile::before,.tile::after{height:155px}
  .tile .emoji{margin-top:115px}
}
@media(max-width:599px){
  .top{padding:14px 15px;min-height:78px}
  .brand{gap:10px}
  .logo{width:50px;height:50px;flex-basis:50px;font-size:23px;border-radius:13px}
  .brand h1{font-size:20px}
  .brand p{font-size:11px}
  .content{padding:17px 14px}
  .grid{gap:12px}
  .tile{min-height:245px;padding:0 13px 15px;border-radius:16px}
  .tile::before,.tile::after{height:128px}
  .tile .emoji{margin-top:92px;width:48px;height:48px;font-size:24px;border-radius:14px}
  .tile b{font-size:16px}
  .tile span:last-child{font-size:12px}
  .card{padding:13px}
}


/* Estadísticas ARS: dashboard de métricas inspirado en la referencia */
.growth-dashboard{color:#102447}
.growth-dashboard .gd-head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(110deg,#fff,#f7fbff);border:1px solid #e5edf7;border-radius:18px;padding:16px;margin:12px 0}
.growth-dashboard .gd-eyebrow{font-size:11px;letter-spacing:.06em;color:#6e829f;font-weight:800;text-transform:uppercase}
.growth-dashboard .gd-title{font-size:clamp(21px,4vw,29px);font-weight:850;letter-spacing:-.7px;color:#102447;margin:4px 0}
.growth-dashboard .gd-sub{font-size:13px;color:#8191a8}
.growth-dashboard .gd-period{max-width:165px;width:auto;min-width:135px;background:#fff;border:1px solid #dbe5f1;border-radius:12px;padding:10px;color:#223a5c;font-size:12px}
.growth-dashboard .gd-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.growth-dashboard .gd-metric{padding:13px;border:1px solid #e4edf7;border-radius:17px;background:#fff;box-shadow:0 5px 16px rgba(20,54,91,.06);min-width:0}
.growth-dashboard .gd-metric .gd-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:21px;font-weight:800;margin-bottom:9px}
.growth-dashboard .gd-label{font-size:12px;color:#607692;line-height:1.25;min-height:30px}
.growth-dashboard .gd-value{font-size:clamp(20px,3vw,29px);font-weight:850;letter-spacing:-.6px;line-height:1.15;margin:5px 0;color:#102447;overflow-wrap:anywhere}

function payments(){return load("payments",[])}
function paymentTotal(otId){return payments().filter(p=>p.otId===otId).reduce((a,p)=>a+Number(p.amount||0),0)}
function addPayment(otId){let amount=Number($("payAmount").value);if(!(amount>0)){alert("Ingresá un importe válido.");return}let file=$("payProof").files[0];let p={id:"PAY-"+Date.now(),otId,amount,date:$("payDate").value,method:$("payMethod").value,fileName:file?.name||"",proofData:null};const saveIt=()=>{let all=payments();all.push(p);save("payments",all);render()};if(file){if(file.size>1500000){alert("El comprobante supera 1,5 MB en esta demo. Usá una imagen/PDF más liviano.");return}let reader=new FileReader();reader.onload=()=>{p.proofData=reader.result;saveIt()};reader.readAsDataURL(file)}else saveIt()}
function deletePayment(id){let p=payments().find(x=>x.id===id);if(!p)return;if(confirm("¿Eliminar esta transferencia/pago? Se actualizarán el saldo de la OT y los ingresos del mes.")){save("payments",payments().filter(x=>x.id!==id));render()}}
const warrantyPads={client:null,worker:null};
function initWarrantyPads(){
  ["client","worker"].forEach(k=>{
    const c=document.getElementById(k==="client"?"sigClientCanvas":"sigWorkerCanvas");
    if(!c)return;
    const rect=c.getBoundingClientRect();
    const cssW=Math.max(240,rect.width||c.parentElement.clientWidth||300);
    const cssH=166;
    const d=Math.max(1,window.devicePixelRatio||1);
    c.style.width="100%";c.style.height=cssH+"px";
    c.width=Math.round(cssW*d);c.height=Math.round(cssH*d);
    const ctx=c.getContext("2d");
    ctx.setTransform(d,0,0,d,0,0);
    ctx.lineWidth=2.5;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#173f37";
    let drawing=false,hasInk=false;
    function pos(e){const b=c.getBoundingClientRect();return{x:(e.clientX-b.left),y:(e.clientY-b.top)}}
    c.onpointerdown=e=>{e.preventDefault();drawing=true;hasInk=true;try{c.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);ctx.beginPath();ctx.arc(p.x,p.y,1.4,0,Math.PI*2);ctx.fillStyle="#173f37";ctx.fill();ctx.beginPath();ctx.moveTo(p.x,p.y);warrantyPads[k]=c.toDataURL("image/png")};
    c.onpointermove=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();warrantyPads[k]=c.toDataURL("image/png")};
    const stop=()=>{if(!drawing)return;drawing=false;if(hasInk)warrantyPads[k]=c.toDataURL("image/png")};
    c.onpointerup=stop;c.onpointercancel=stop;c.onlostpointercapture=stop;
  });
}

m.innerHTML=`${headerBack(state.category==="Refrigeración"?"Sectores":"Rubros",back)}<h2 class="title">${heading}</h2><p class="muted">Seleccioná los trabajos. Los precios son editables desde Ajustes.</p>${list.length?list.map(s=>{let key=state.category+"|"+s.name,sel=state.selected.find(x=>x.key===key);return `<div class="item"><div class="service"><div class="emoji">${s.emoji||"🛠️"}</div><div><b>${esc(s.name)}</b><div class="muted">${esc(s.unit)}</div><div class="price">${money(s.price)}</div></div></div><div class="qty"><button class="small" onclick="changeQty('${key}',-1)">−</button><b>${sel?sel.qty:0}</b><button class="small" onclick="changeQty('${key}',1)">＋</button></div></div>`}).join(""):`<div class="notice">No hay servicios cargados para este sector todavía. Podés agregarlos desde Ajustes → Servicios y precios.</div>`}<div class="total" style="margin-top:16px"><div class="row"><span>Subtotal mano de obra</span><b>${money(state.selected.reduce((a,x)=>a+x.price*x.qty,0))}</b></div><div class="smallmuted">Materiales no incluidos.</div></div><div class="actions"><button class="outline" onclick="${back}">${state.category==="Refrigeración"?"Cambiar sector":"Cambiar rubro"}</button><button onclick="setPage('quoteReview')">Revisar presupuesto</button></div>`;return}
if(state.page==="quoteReview"){let c=state.currentClient,addr=typeof state.currentAddress==="number"?(c.addresses||[])[state.currentAddress]:state.currentAddress;let subtotal=state.selected.reduce((a,x)=>a+x.price*x.qty,0);let discountPercent=Math.min(100,Math.max(0,Number(state.discountPercent||0)));let discountAmount=Math.round(subtotal*discountPercent/100);let total=subtotal-discountAmount;m.innerHTML=`${headerBack("Servicios","setPage('quoteServices')")}<h2 class="title">Revisar presupuesto</h2><div class="card"><b>${esc(c.name)}</b><div class="muted">${esc(addr?.label||"Dirección de trabajo")}: ${esc(addr?.address||"Sin dirección")}</div><div class="muted">${esc(c.phone||"")}</div></div><div class="card" style="margin-top:12px">${state.selected.length?state.selected.map(x=>`<div class="item"><div>${esc(x.name)}<div class="muted">${x.qty} × ${money(x.price)}</div></div><b>${money(x.qty*x.price)}</b></div>`).join(""):`<p class="muted">No seleccionaste servicios. Podés guardar un presupuesto en $0 como borrador o volver y elegirlos.</p>`}<div class="total"><div class="row"><span>Subtotal mano de obra</span><b id="qSubtotal">${money(subtotal)}</b></div><div class="field"><label for="qdiscount">Descuento sobre el presupuesto (%)</label><input id="qdiscount" type="number" min="0" max="100" step="1" value="${discountPercent}" oninput="updateQuoteDiscount()" placeholder="0"><div class="smallmuted">Ingresá 0 si no corresponde descuento. Máximo permitido: 100 %.</div></div><div class="row"><span>Descuento aplicado</span><b id="qDiscountAmount">${money(discountAmount)}</b></div><div class="row" style="margin-top:10px"><b>Total final de mano de obra</b><strong id="qFinalTotal">${money(total)}</strong></div><div class="smallmuted" style="margin-top:6px">Materiales a cargo del cliente.</div></div><div class="field"><label>Observaciones / condiciones</label><textarea id="qnotes" placeholder="Plazo, alcance, condiciones..."></textarea></div><div class="actions"><button class="outline" onclick="setPage('quoteServices')">Volver</button><button onclick="saveQuote()">Guardar presupuesto</button></div></div>`;return}
  if(state.page==="quoteList"){m.innerHTML=`${headerBack("Inicio","setPage('home')")}<div class="row"><h2 class="title">Presupuestos guardados</h2>${can("quotes_create")?`<button class="small" onclick="newQuote()">＋ Nuevo</button>`:""}</div>${quotes().length?quotes().slice().reverse().map(q=>`<div class="card" style="margin-top:10px"><div class="row"><b>${esc(q.id)} · ${esc(q.clientName)}</b><span class="pill ${q.status==='Aceptado'?'':'gray'}">${esc(q.status)}</span></div><div class="muted">${esc(q.category)} · ${esc(q.date)}</div><div class="row" style="margin-top:8px"><b>${money(q.total)}</b><div class="actions" style="margin:0"><button class="outline small" onclick="viewQuote('${q.id}')">Ver</button>${can("quotes_status")?`<button class="small" onclick="quoteStatus('${q.id}')">Estado</button>`:""}</div></div></div>`).join(""):`<p class="muted">Todavía no guardaste presupuestos.</p>`}`;return}
if(state.page==="quoteDetail"){let q=state.currentQuote;m.innerHTML=`${headerBack("Presupuestos","setPage('quoteList')")}<h2 class="title">${esc(q.id)}</h2><div class="card"><div class="row"><b>${esc(q.clientName)}</b><span class="pill">${esc(q.status==="Borrador"?"En espera":q.status||"En espera")}</span></div><p class="muted">${esc(q.address||"")}</p>${q.items.map(x=>`<div class="item"><div>${esc(x.name)}<div class="muted">${x.qty} × ${money(x.price)}</div></div><b>${money(x.qty*x.price)}</b></div>`).join("")}<div class="total">${q.discountPercent?`<div class="row"><span>Subtotal</span><b>${money(q.subtotal??q.items.reduce((a,x)=>a+x.price*x.qty,0))}</b></div><div class="row" style="margin-top:6px"><span>Descuento (${Number(q.discountPercent)} %)</span><b>− ${money(q.discountAmount??0)}</b></div>`:""}<div class="row" style="margin-top:8px"><b>Total final</b><strong>${money(q.total)}</strong></div></div><p class="muted">${esc(q.notes||"Sin observaciones")}</p><div class="actions" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch;gap:9px">${can("quotes_status")?`<select aria-label="Estado del presupuesto" style="min-width:0;width:100%;border:1px solid #cbd7d2;border-radius:12px;padding:12px 10px;background:#e8efec;color:var(--green);font:inherit;font-weight:700" onchange="setQuoteStatus('${q.id}',this.value)"><option value="En espera" ${q.status==="En espera"||q.status==="Borrador"||!q.status?"selected":""}>⏳ En espera</option><option value="Rechazado" ${q.status==="Rechazado"?"selected":""}>❌ Rechazado</option></select>`:""}${can("quotes_status")&&can("ot_view")?(q.status!=="Aceptado"?`<button style="min-width:0" onclick="acceptQuote('${q.id}')">Cliente aceptó · Crear OT</button>`:`<button style="min-width:0" onclick="makeOT('${q.id}')">Crear OT</button>`):""}</div></div>`;return}
if(state.page==="otmenu"){m.innerHTML=`${headerBack("Inicio","setPage('home')")}<h2 class="title">Órdenes de trabajo</h2><p class="muted">Solo trabajos aprobados por el cliente.</p><div class="grid"><button class="tile" onclick="state.otFilter='En proceso';setPage('otlist')"><span class="emoji">🔄</span><b>En proceso</b><span>${ots().filter(o=>o.status==='En proceso').length} trabajos activos</span></button><button class="tile" onclick="state.otFilter='Finalizada';setPage('otlist')"><span class="emoji">✅</span><b>Finalizadas</b><span>${ots().filter(o=>o.status==='Finalizada').length} trabajos terminados</span></button></div><div class="actions"><button class="outline" onclick="setPage('quoteList')">Ver presupuestos</button></div>`;return}
if(state.page==="otlist"){let list=ots().filter(o=>o.status===state.otFilter);m.innerHTML=`${headerBack("Órdenes de trabajo","setPage('otmenu')")}<h2 class="title">OT · ${state.otFilter}</h2>${list.length?list.slice().reverse().map(o=>`<div class="card" style="margin-top:10px"><div class="row"><b>${esc(o.id)} · ${esc(o.clientName)}</b><span class="pill ${o.status==='Finalizada'?'':'amber'}">${esc(o.status)}</span></div><div class="muted">${esc(o.category)} · ${esc(o.address||"")}</div><div class="row" style="margin-top:8px"><b>${money(o.total)}</b><button class="outline small" onclick="viewOT('${o.id}')">Abrir OT</button></div></div>`).join(""):`<div class="card"><p class="muted">No hay órdenes ${state.otFilter.toLowerCase()} todavía. Cuando acepten un presupuesto, podés crear la OT correspondiente.</p></div>`}`;return}
if(state.page==="otDetail"){let o=state.currentOT;m.innerHTML=`${headerBack("Volver a órdenes de trabajo","backToOTList()")}<h2 class="title">${esc(o.id)}</h2><div class="card"><div class="row"><b>${esc(o.clientName)}</b><span class="pill ${o.status==='Finalizada'?'':'amber'}">${esc(o.status)}</span></div><p class="muted">${esc(o.address||"")}</p><div class="item"><span>Trabajo</span><b>${esc(o.category)}</b></div><div class="item"><span>Importe mano de obra</span><b>${money(o.total)}</b></div><div class="item"><span>Creada</span><span>${esc(o.date)}</span></div><div class="field"><label>Notas de trabajo</label><textarea id="otnotes">${esc(o.notes||"")}</textarea></div><div class="actions">${can("ot_update")?(o.status==="En proceso"?`<button onclick="finishOT('${o.id}')">✓ Marcar como finalizada</button>`:`<button class="secondary" onclick="reopenOT('${o.id}')">Reabrir OT</button>`):""}${can("ot_update")?`<button class="outline" onclick="saveOTNotes('${o.id}')">Guardar notas</button>`:""}</div></div>
<div class="sectionhead"><h2>💳 Pagos y comprobantes</h2><div class="line"></div></div>
<div class="card"><div class="item"><span>Total de la OT</span><b>${money(o.total)}</b></div><div class="item"><span>Total cobrado</span><b>${money(paymentTotal(o.id))}</b></div><div class="item"><span>Saldo pendiente</span><b>${money(Math.max(0,Number(o.total)-paymentTotal(o.id)))}</b></div>
<div class="field"><label>Importe del pago</label><input id="payAmount" type="number" min="1" step="1" placeholder="Importe en pesos"></div>
<div class="field"><label>Fecha del pago</label><input id="payDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
<div class="field"><label>Medio de pago</label><select id="payMethod"><option>Transferencia</option><option>Efectivo</option><option>Mercado Pago</option><option>Otro</option></select></div>
<div class="field"><label>Comprobante (imagen o PDF)</label><input id="payProof" type="file" accept="image/*,.pdf"></div>
<button onclick="addPayment('${o.id}')">＋ Registrar pago</button>
<div class="stack" style="margin-top:12px">${payments().filter(p=>p.otId===o.id).map(p=>`<div class="item"><div><b>${money(p.amount)}</b><div class="muted">${esc(p.date)} · ${esc(p.method)} ${p.fileName?'· '+esc(p.fileName):''}</div></div><button class="outline small" onclick="deletePayment('${p.id}')">Eliminar</button></div>`).join("")||'<p class="muted">Todavía no hay pagos registrados.</p>'}</div></div>
<div class="sectionhead" id="warrantySection"><h2>🛡️ Garantía</h2><div class="line"></div></div>
<div class="card"><p class="muted">${/plano|firma/i.test(o.category+' '+(o.serviceNames||''))?'Planos y firma: no se emite la garantía comercial habitual.':'12 meses de garantía comercial de mano de obra y dos revisiones técnicas gratuitas.'}</p>
${!(/plano|firma/i.test(o.category+' '+(o.serviceNames||'')))?`<div class="field"><label>Nombre del cliente</label><input id="sigClientName" value="${esc(o.clientName||'')}" placeholder="Nombre del cliente"></div><div class="field"><label>Empleado ARS que finaliza la OT</label><input id="sigWorkerName" value="${esc(state.currentUser?.name||'')}" placeholder="Empleado responsable"></div><div class="sigrow"><div><label>Firma del cliente</label><div class="sigpad"><canvas id="sigClientCanvas"></canvas></div><button class="outline small" onclick="clearWarrantySig('client')">Borrar firma</button></div><div><label>Firma del empleado ARS</label><div class="sigpad"><canvas id="sigWorkerCanvas"></canvas></div><button class="outline small" onclick="clearWarrantySig('worker')">Borrar firma</button></div></div><button style="margin-top:12px" onclick="createWarranty('${o.id}')">Generar certificado de garantía</button>${o.warranty?`<div class="notice" style="margin-top:10px">Garantía generada · Inicio: ${esc(o.warranty.start)} · Vencimiento: ${esc(o.warranty.end)}</div><button class="secondary" style="margin-top:8px" onclick="downloadWarranty('${o.id}')">Descargar / compartir certificado</button>`:''}`:'<div class="notice">Esta OT está excluida de la garantía comercial de ARS para planos y firma.</div>'}
</div>`;initWarrantyPads();return}
}
function newQuote(){if(!can("quotes_create")){alert("No tenés permiso para crear presupuestos.");return}state.selected=[];state.discountPercent=0;state.currentClient=null;state.currentAddress=null;setPage("quoteClient")}
function clientListHtml(list){return list.length?list.map(c=>{let i=clients().findIndex(x=>x.name===c.name&&x.phone===c.phone);return `<button class="tile" style="width:100%;margin:6px 0;min-height:auto" onclick="chooseClient(${i})"><span class="emoji">👤</span><b>${esc(c.name)}</b><span>${esc(c.phone||"Sin teléfono")} · ${(c.addresses||[]).length} dirección(es)</span></button>`}).join(""):`<p class="muted">No hay clientes registrados. Creá uno nuevo para continuar.</p>`}
function filterClients(){let q=$("clientSearch").value.toLowerCase();$("clientList").innerHTML=clientListHtml(clients().filter(c=>(c.name+" "+c.phone+" "+c.tax).toLowerCase().includes(q)))}
function chooseClient(i){state.currentClientIndex=i;state.currentClient=clients()[i];state.currentAddress=null;setPage("quoteAddress")}
function clientForm(){state.editingClient=null;state.returnPage="clients";setPage("clientForm")}
function editClient(i){state.editingClient={...clients()[i],index:i};setPage("clientForm")}
function addUserForm(){state.editingUser={};setPage("userForm")}
function editUser(i){state.editingUser={...users()[i],index:i};setPage("userForm")}
function deleteUser(i){let all=users(),u=all[i];if(!u)return;if(confirm("¿Eliminar el acceso de "+u.name+"?")){all.splice(i,1);save("users",all);render()}}
function addServiceForm(){state.editingService={};setPage("serviceForm")}
function editService(i){state.editingService={...services()[i],index:i};setPage("serviceForm")}
function changeQty(key,delta){let s=services().find(s=>state.category+"|"+s.name===key);if(!s)return;let x=state.selected.find(x=>x.key===key);if(!x&&delta>0)state.selected.push({key,name:s.name,price:Number(s.price),qty:1,category:s.category,unit:s.unit});else if(x){x.qty+=delta;if(x.qty<=0)state.selected=state.selected.filter(y=>y.key!==key)}render()}
function updateQuoteDiscount(){const input=$("qdiscount");if(!input)return;let pct=Math.min(100,Math.max(0,Number(input.value||0)));const subtotal=state.selected.reduce((a,x)=>a+x.price*x.qty,0);const discount=Math.round(subtotal*pct/100);const total=subtotal-discount;const subEl=$("qSubtotal"),discEl=$("qDiscountAmount"),totalEl=$("qFinalTotal");if(subEl)subEl.textContent=money(subtotal);if(discEl)discEl.textContent=money(discount);if(totalEl)totalEl.textContent=money(total);state.discountPercent=pct}
function saveQuote(){if(!can("quotes_create")){alert("No tenés permiso para guardar presupuestos.");return}let c=state.currentClient,addr=typeof state.currentAddress==="number"?(c.addresses||[])[state.currentAddress]:state.currentAddress;let all=quotes(),id="P-"+String(Date.now()).slice(-6);let subtotal=state.selected.reduce((a,x)=>a+x.price*x.qty,0);let discountPercent=Math.min(100,Math.max(0,Number($("qdiscount")?.value||0)));let discountAmount=Math.round(subtotal*discountPercent/100);let total=subtotal-discountAmount;let q={id,clientName:c.name,clientId:state.currentClientIndex,address:addr?.address||"",category:[...new Set(state.selected.map(x=>x.category))].join(", ")||state.category,items:state.selected.map(x=>({...x})),subtotal,discountPercent,discountAmount,total,status:"En espera",date:new Date().toLocaleDateString("es-AR"),createdAt:new Date().toISOString(),notes:$("qnotes")?.value||""};all.push(q);save("quotes",all);state.selected=[];state.discountPercent=0;state.currentQuote=q;setPage("quoteDetail")}
function viewQuote(id){state.currentQuote=quotes().find(q=>q.id===id);setPage("quoteDetail")}
function setQuoteStatus(id,status){if(!can("quotes_status")){alert("No tenés permiso para cambiar estados.");render();return}if(!["En espera","Rechazado","Aceptado"].includes(status)){alert("Estado no válido.");render();return}let all=quotes(),q=all.find(x=>x.id===id);if(!q)return;if(status==="Aceptado"){if(!confirm("¿Confirmás que el cliente aceptó este presupuesto? Podés crear la OT con el botón correspondiente.")){render();return}}q.status=status;q.statusUpdatedAt=new Date().toISOString();save("quotes",all);state.currentQuote=q;render()}
function rejectQuote(id){if(!can("quotes_status")){alert("No tenés permiso para cambiar estados.");return}let all=quotes(),q=all.find(x=>x.id===id);if(!q)return;if(!confirm("¿Marcar el presupuesto "+id+" como rechazado? El importe quedará contabilizado en las estadísticas de presupuestos rechazados."))return;q.status="Rechazado";q.statusUpdatedAt=new Date().toISOString();save("quotes",all);state.currentQuote=q;render()}
function restoreQuoteWaiting(id){if(!can("quotes_status")){alert("No tenés permiso para cambiar estados.");return}let all=quotes(),q=all.find(x=>x.id===id);if(!q)return;q.status="En espera";q.statusUpdatedAt=new Date().toISOString();save("quotes",all);state.currentQuote=q;render()}
function quoteStatus(id){if(!can("quotes_status")){alert("No tenés permiso para cambiar estados.");return}let all=quotes(),q=all.find(q=>q.id===id);if(!q)return;let choice=prompt("Estado del presupuesto:\\nEnviado\\nEn espera\\nRechazado\\nAceptado",q.status||"Enviado");if(!choice)return;let map={"enviado":"Enviado","en espera":"En espera","espera":"En espera","rechazado":"Rechazado","aceptado":"Aceptado"};let next=map[choice.trim().toLowerCase()];if(!next){alert("Opción no válida. Elegí: Enviado, En espera, Rechazado o Aceptado.");return}q.status=next;q.statusUpdatedAt=new Date().toISOString();save("quotes",all);if(next==="Aceptado"&&!ots().some(o=>o.quoteId===id)&&confirm("¿Crear ahora la OT de este presupuesto aceptado?"))makeOT(id);else render()}
function acceptQuote(id){if(!can("quotes_status")||!can("ot_view")){alert("No tenés permiso para aceptar presupuestos y crear OT.");return}let all=quotes(),q=all.find(q=>q.id===id);q.status="Aceptado";save("quotes",all);makeOT(id)}
function makeOT(id){if(!can("quotes_status")||!can("ot_view")){alert("No tenés permiso para crear órdenes de trabajo.");return}let q=quotes().find(q=>q.id===id);if(!q)return;if(ots().some(o=>o.quoteId===id)){alert("Este presupuesto ya tiene una OT.");return}let all=ots(),o={id:"OT-"+String(Date.now()).slice(-6),quoteId:id,clientName:q.clientName,address:q.address,category:q.category,total:q.total,status:"En proceso",date:new Date().toLocaleDateString("es-AR"),notes:""};all.push(o);save("ots",all);state.currentOT=o;setPage("otDetail")}
function viewOT(id){state.currentOT=ots().find(o=>o.id===id);setPage("otDetail")}
function finishOT(id){if(!can("ot_update")){alert("No tenés permiso para finalizar OT.");return}let all=ots(),o=all.find(o=>o.id===id);if(!o)return;if(/plano|firma/i.test(o.category+' '+(o.serviceNames||''))){if(!confirm("Este trabajo de planos y firma no lleva la garantía comercial habitual de ARS. ¿Querés finalizar la OT igualmente?"))return;o.status="Finalizada";o.finishedAt=new Date().toLocaleDateString("es-AR");save("ots",all);state.currentOT=o;setPage("otDetail");return}o.finishedAt=new Date().toLocaleDateString("es-AR");o.status="Pendiente de firma";save("ots",all);state.currentOT=o;setPage("otDetail");setTimeout(()=>{const el=document.getElementById("warrantySection");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},120)}
function reopenOT(id){if(!can("ot_update")){alert("No tenés permiso para reabrir OT.");return}let all=ots(),o=all.find(o=>o.id===id);o.status="En proceso";save("ots",all);state.currentOT=o;setPage("otDetail")}
function saveOTNotes(id){if(!can("ot_update")){alert("No tenés permiso para modificar OT.");return}let all=ots(),o=all.find(o=>o.id===id);o.notes=$("otnotes").value;save("ots",all);state.currentOT=o;alert("Notas guardadas en este navegador.");render()}
if(!localStorage.getItem("ars_users"))save("users",[defaultAdmin]);
render();
</script>
